<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Lab82 × BTRMRK — coming soon</title>
<meta name="description" content="Lab82 and BTRMRK. Coming soon.">
<meta name="theme-color" content="#FCE7EF">

<meta property="og:title" content="Lab82 × BTRMRK — coming soon">
<meta property="og:description" content="Lab82 and BTRMRK. Coming soon.">
<meta property="og:image" content="Image1.jpg">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400&display=swap" rel="stylesheet">

<style>
/* ---------------------------------------------------------------
   Lab82 × BTRMRK — holding page
   Drop Image1.jpg … Image12.jpg and btrmrk.png next to this file.
   To add more photos, edit the IMAGES list in the script below.
   --------------------------------------------------------------- */

:root{
  --porcelain:#FCE7EF;
  --blush:#F2C8DA;
  --pink:#F586A4;
  --rose:#C0637E;
  --deep:#7E3A51;
  --ink:#3A2730;

  --radius:clamp(200px, 27vw, 490px);  /* how wide the vortex swings */
  --rise:clamp(165px, 30vh, 340px);    /* how tall the vortex stands */
  --cw:clamp(86px, 9.4vw, 158px);      /* card width                 */
  --ch:calc(var(--cw) * 1.27);         /* card height                */
}

*{box-sizing:border-box}

html,body{height:100%}

body{
  margin:0;
  background:
    radial-gradient(118% 88% at 50% 45%, #FFF1F6 0%, var(--porcelain) 38%, var(--blush) 100%);
  color:var(--ink);
  font-family:"Jost", "Futura", "Century Gothic", system-ui, sans-serif;
  font-weight:300;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  overscroll-behavior:none;
  touch-action:none;                 /* the whole surface is draggable */
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;
  user-select:none;
}

.page{
  position:relative;
  height:100dvh;
  min-height:100svh;
  display:grid;
  place-items:center;
  isolation:isolate;
  cursor:grab;
}

.page.is-dragging{cursor:grabbing}

/* ---------- the vortex ---------- */

.stage{
  position:absolute;
  inset:0;
  perspective:1400px;
  perspective-origin:50% 48%;
  z-index:1;
  opacity:0;
  animation:settle 2.2s .15s cubic-bezier(.2,.7,.2,1) forwards;
}

.tilt{
  position:absolute;
  left:50%;
  top:48%;
  transform-style:preserve-3d;
  transform:rotateZ(-4deg) rotateX(5deg);
}

.vortex{
  position:absolute;
  transform-style:preserve-3d;
  will-change:transform;
}

.card{
  position:absolute;
  width:var(--cw);
  height:var(--ch);
  margin-left:calc(var(--cw) / -2);
  margin-top:calc(var(--ch) / -2);
  transform-style:preserve-3d;
  transform:
    rotateY(calc(var(--a) * 1deg))
    translateZ(calc(var(--r) * var(--radius)))
    translateY(calc(var(--y) * var(--rise)))
    rotateZ(calc(var(--rz) * 1deg))
    scale(var(--s));
}

.face{
  display:block;
  width:100%;
  height:100%;
  border-radius:14px;
  overflow:hidden;
  background:linear-gradient(150deg,#F6C9D6,#E9A3B8);
  box-shadow:
    0 22px 46px -24px rgba(110,45,68,.6),
    0 0 0 1px rgba(255,255,255,.55);
}

.face img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  pointer-events:none;
}

@keyframes settle{
  from{opacity:0; transform:scale(.92)}
  to  {opacity:1; transform:scale(1)}
}

/* ---------- the eye of the vortex ---------- */

.scrim{
  position:absolute;
  inset:0;
  z-index:2;
  pointer-events:none;
  background:radial-gradient(
    26% 36% at 50% 50%,
    rgba(255,243,248,.93) 0%,
    rgba(255,243,248,.82) 52%,
    rgba(255,243,248,.34) 78%,
    rgba(255,243,248,0)   100%);
}

.lockup{
  position:relative;
  z-index:3;
  text-align:center;
  padding:0 24px;
  pointer-events:none;
  text-shadow:0 0 34px rgba(255,243,248,.98), 0 0 14px rgba(255,243,248,.95), 0 0 5px rgba(255,243,248,.9);
  opacity:0;
  animation:settle 1.6s .45s ease-out forwards;
}

.lab{
  margin:0;
  font-size:clamp(3rem, 12vw, 6.2rem);
  font-weight:200;
  line-height:.92;
  letter-spacing:.09em;
  text-indent:.09em;
  color:var(--pink);
}

.tag{
  margin:.85rem 0 0;
  font-size:clamp(.66rem, 1.7vw, .8rem);
  font-weight:300;
  letter-spacing:.34em;
  text-indent:.34em;
  color:var(--deep);
}

.cross{
  display:block;
  margin:clamp(1rem, 3vw, 1.7rem) 0;
  font-size:clamp(1.9rem, 5.5vw, 3.1rem);
  line-height:1;
  font-weight:200;
  color:var(--pink);
}

.mrk{
  display:block;
  margin:0 auto;
  width:clamp(160px, 23vw, 290px);
  height:auto;
  filter:
    drop-shadow(0 0 18px rgba(255,243,248,.97))
    drop-shadow(0 0 7px rgba(255,243,248,.95));
}

.soon{
  margin:clamp(1.9rem, 6vw, 3rem) 0 0;
  font-size:clamp(.82rem, 2.2vw, 1rem);
  font-weight:400;
  text-transform:uppercase;
  letter-spacing:.24em;
  text-indent:.24em;
  color:var(--deep);
}

/* ---------- smaller screens ---------- */

@media (max-width:820px){
  .scrim{background:radial-gradient(
    58% 40% at 50% 50%,
    rgba(255,243,248,.96) 0%,
    rgba(255,243,248,.9)  52%,
    rgba(255,243,248,0)   100%)}
}

@media (max-width:480px){
  .stage{perspective:900px}
  .face{box-shadow:0 14px 30px -20px rgba(110,45,68,.55), 0 0 0 1px rgba(255,255,255,.5)}
}
</style>
</head>

<body>
<main class="page" id="page">

  <div class="stage" aria-hidden="true">
    <div class="tilt" id="tilt">
      <div class="vortex" id="vortex"></div>
    </div>
  </div>

  <div class="scrim" aria-hidden="true"></div>

  <div class="lockup">
    <h1 class="lab">LAB82</h1>
    <p class="tag">where science meets skin</p>
    <span class="cross">&#215;</span>
    <img class="mrk" src="btrmrk.png" alt="BTRMRK" width="1100" height="143">
    <p class="soon">Coming soon</p>
  </div>

</main>

<script>
(function () {
  /* Photos used in the vortex. Add more files here as you add them
     to the folder — the spiral rebuilds itself around the list.
     Any mix of .jpg / .png / .webp is fine. */
  var IMAGES = [
    'Image1.jpg',  'Image2.jpg',  'Image3.jpg',  'Image4.jpg',
    'Image5.jpg',  'Image6.jpg',  'Image7.jpg',  'Image8.jpg',
    'Image9.jpg',  'Image10.jpg', 'Image11.jpg', 'Image12.jpg',
   'Image13.jpg',  'Image14.jpg', 'Image15.jpg'
  ];

  var vortex = document.getElementById('vortex');
  var tilt   = document.getElementById('tilt');
  var page   = document.getElementById('page');
  if (!vortex) return;

  var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var hover = matchMedia('(hover: hover) and (pointer: fine)').matches;
  var phone = matchMedia('(max-width: 600px)').matches;

  var COUNT = phone ? 20 : 30;   // fewer cards to draw on a phone
  var TURNS = 2.6;               // how many times the spiral wraps
  var BASE  = still ? 0 : 360 / 46;  // degrees per second at rest

  /* ---------- build the spiral ---------- */

  var cards = [];
  var frag  = document.createDocumentFragment();

  /* fixed seed, so the scatter is the same on every visit */
  var seed = 0x9e3779b9;
  function rnd() {
    seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5;
    return ((seed >>> 0) / 4294967296);
  }
  function jit(n) { return (rnd() * 2 - 1) * n; }

  for (var i = 0; i < COUNT; i++) {
    /* even spacing would band the cards into rows — push each one off its mark */
    var u = (i / (COUNT - 1)) * 2 - 1 + jit(0.13);   // -1 at the base, 1 at the top
    u = Math.max(-1.08, Math.min(1.08, u));
    var a = (i * 360 * TURNS / COUNT + jit(16)) % 360;
    var swell = Math.cos(Math.max(-1, Math.min(1, u)) * Math.PI / 2);

    var card = document.createElement('div');
    card.className = 'card';
    card.style.setProperty('--a', a.toFixed(2));
    card.style.setProperty('--y', u.toFixed(3));
    card.style.setProperty('--r', ((0.55 + 0.45 * swell) * (0.87 + rnd() * 0.26)).toFixed(3));
    card.style.setProperty('--s', ((0.74 + 0.26 * swell) * (0.84 + rnd() * 0.34)).toFixed(3));
    card.style.setProperty('--rz', jit(4).toFixed(2));

    var face = document.createElement('div');
    face.className = 'face';

    var img = document.createElement('img');
    img.src = IMAGES[(i * 5) % IMAGES.length];
    img.alt = '';
    img.loading = i < 10 ? 'eager' : 'lazy';
    img.decoding = 'async';
    img.style.objectPosition = (18 + (i * 29) % 64) + '% ' + (20 + (i * 41) % 60) + '%';
    if (i % 3 === 1) img.style.transform = 'scaleX(-1)';
    img.addEventListener('error', function () { this.remove(); });

    face.appendChild(img);
    card.appendChild(face);
    frag.appendChild(card);

    cards.push({face: face, angle: a, o: -1});
  }

  vortex.appendChild(frag);

  /* ---------- state ---------- */

  var spin = 0;        // current rotation, degrees
  var drift = 0;       // extra spin from a throw, degrees per second
  var bias = 0;        // gentle speed-up from cursor position
  var tx = 0, ty = 0;  // where the tilt is
  var gx = 0, gy = 0;  // where the tilt wants to be

  var dragging = false, lastX = 0, lastY = 0, lastT = 0;

  /* ---------- pointer: drag to spin, move to lean ---------- */

  page.addEventListener('pointerdown', function (e) {
    dragging = true;
    drift = 0;
    lastX = e.clientX; lastY = e.clientY; lastT = e.timeStamp;
    page.classList.add('is-dragging');
    try { page.setPointerCapture(e.pointerId); } catch (err) {}
  });

  page.addEventListener('pointermove', function (e) {
    if (dragging) {
      var dx = e.clientX - lastX;
      var dt = Math.max(e.timeStamp - lastT, 8) / 1000;
      spin += dx * 0.42;                        // 1px of drag ≈ 0.42°
      drift = (dx * 0.42) / dt;                 // remember the throw
      lastX = e.clientX; lastY = e.clientY; lastT = e.timeStamp;
    }
    if (hover || dragging) aim(e.clientX, e.clientY);
  }, {passive: true});

  function release(e) {
    if (!dragging) return;
    dragging = false;
    page.classList.remove('is-dragging');
    drift = Math.max(-900, Math.min(900, drift));   // cap the throw
    try {
      if (e && e.pointerId != null && page.hasPointerCapture(e.pointerId)) {
        page.releasePointerCapture(e.pointerId);
      }
    } catch (err) {}
  }
  page.addEventListener('pointerup', release);
  page.addEventListener('pointercancel', release);
  page.addEventListener('pointerleave', function () { if (!dragging) { gx = 0; gy = 0; bias = 0; } });

  function aim(px, py) {
    var nx = (px / innerWidth  - 0.5) * 2;
    var ny = (py / innerHeight - 0.5) * 2;
    gx = nx;
    gy = ny;
    if (hover && !dragging) bias = nx * BASE * 0.6;   // lean right, spin faster
  }

  /* ---------- the loop ---------- */

  var prev = 0;

  function frame(now) {
    var dt = prev ? Math.min((now - prev) / 1000, 0.05) : 0.016;
    prev = now;

    if (!dragging) {
      spin += (BASE + bias + drift) * dt;
      drift *= Math.exp(-2.6 * dt);          // the throw runs out
    }
    if (spin > 3600 || spin < -3600) spin %= 360;

    vortex.style.transform = 'rotateY(' + spin.toFixed(2) + 'deg)';

    /* the lean chases the pointer instead of trailing a second behind it */
    var k = still ? 1 : 1 - Math.exp(-11 * dt);
    tx += (gx - tx) * k;
    ty += (gy - ty) * k;
    tilt.style.transform =
      'rotateZ(' + (-4 + tx * 3.5).toFixed(2) + 'deg) ' +
      'rotateX(' + (5 - ty * 9).toFixed(2) + 'deg) ' +
      'rotateY(' + (tx * 9).toFixed(2) + 'deg)';

    /* depth: crisp at the front, dissolving into the light at the back */
    for (var i = 0; i < cards.length; i++) {
      var c = cards[i];
      var f = (Math.cos((spin + c.angle) * Math.PI / 180) + 1) / 2;
      var o = 0.2 + 0.8 * Math.pow(f, 0.8);
      if (Math.abs(o - c.o) > 0.008) c.face.style.opacity = c.o = o;
    }

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);

  /* pause the work entirely when the tab is hidden */
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) prev = 0;
  });
})();
</script>
</body>
</html>
