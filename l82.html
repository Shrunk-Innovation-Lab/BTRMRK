<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Lab82 × BTRMRK — coming soon</title>
<meta name="description" content="Lab82 and BTRMRK. Coming soon.">
<meta name="theme-color" content="#FCF5F7">

<meta property="og:title" content="Lab82 × BTRMRK — coming soon">
<meta property="og:description" content="Lab82 and BTRMRK. Coming soon.">
<meta property="og:image" content="Image1.jpg">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400&display=swap" rel="stylesheet">

<style>
/* ---------------------------------------------------------------
   Lab82 × BTRMRK — holding page
   Drop Image1.jpg and Image2.jpg next to this file.
   To add more photos, edit the IMAGES list in the script below.
   --------------------------------------------------------------- */

:root{
  --porcelain:#FCF5F7;
  --blush:#F6E1E8;
  --pink:#F586A4;
  --rose:#C0637E;
  --deep:#7E3A51;
  --ink:#3A2730;

  --radius:clamp(200px, 27vw, 490px);  /* how wide the vortex swings */
  --rise:clamp(165px, 30vh, 340px);    /* how tall the vortex stands */
  --cw:clamp(86px, 9.4vw, 158px);      /* card width                 */
  --ch:calc(var(--cw) * 1.27);         /* card height                */
  --spin:46s;                          /* one full revolution        */
}

*{box-sizing:border-box}

html,body{height:100%}

body{
  margin:0;
  background:
    radial-gradient(120% 90% at 50% 45%, #FFFBFC 0%, var(--porcelain) 42%, var(--blush) 100%);
  color:var(--ink);
  font-family:"Jost", "Futura", "Century Gothic", system-ui, sans-serif;
  font-weight:300;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}

.page{
  position:relative;
  height:100dvh;
  min-height:100svh;
  display:grid;
  place-items:center;
  isolation:isolate;
}

/* ---------- the vortex ---------- */

.stage{
  position:absolute;
  inset:0;
  perspective:1400px;
  perspective-origin:50% 48%;
  z-index:1;
  opacity:0;
  animation:settle 2.2s .15s cubic-bezier(.2,.7,.2,1) forwards;
}

.tilt{
  position:absolute;
  left:50%;
  top:48%;
  transform-style:preserve-3d;
  transform:rotateZ(-4deg) rotateX(5deg);
  transition:transform .9s cubic-bezier(.2,.7,.2,1);
  will-change:transform;
}

.vortex{
  position:absolute;
  transform-style:preserve-3d;
  animation:spin var(--spin) linear infinite;
}

.card{
  position:absolute;
  width:var(--cw);
  height:var(--ch);
  margin-left:calc(var(--cw) / -2);
  margin-top:calc(var(--ch) / -2);
  transform-style:preserve-3d;
  transform:
    rotateY(calc(var(--a) * 1deg))
    translateZ(calc(var(--r) * var(--radius)))
    translateY(calc(var(--y) * var(--rise)))
    scale(var(--s));
}

.face{
  display:block;
  width:100%;
  height:100%;
  border-radius:14px;
  overflow:hidden;
  background:linear-gradient(150deg,#F6C9D6,#E9A3B8);
  box-shadow:
    0 22px 46px -24px rgba(110,45,68,.6),
    0 0 0 1px rgba(255,255,255,.55);
  animation:depth var(--spin) linear infinite;
  will-change:opacity, filter;
}

.face img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

/* Front of the turn: crisp. Back of the turn: dissolving into the light. */
@keyframes depth{
  0%   {opacity:1;   filter:saturate(1.05) contrast(1.04) blur(0)}
  30%  {opacity:.82; filter:saturate(.9)   contrast(.92)  blur(.3px)}
  50%  {opacity:.3;  filter:saturate(.5)   contrast(.66)  blur(2.2px)}
  70%  {opacity:.82; filter:saturate(.9)   contrast(.92)  blur(.3px)}
  100% {opacity:1;   filter:saturate(1.05) contrast(1.04) blur(0)}
}

@keyframes spin{
  from{transform:rotateY(0deg)}
  to  {transform:rotateY(360deg)}
}

@keyframes settle{
  from{opacity:0; transform:scale(.92)}
  to  {opacity:1; transform:scale(1)}
}

/* ---------- the eye of the vortex ---------- */

.scrim{
  position:absolute;
  inset:0;
  z-index:2;
  pointer-events:none;
  background:radial-gradient(
    26% 36% at 50% 50%,
    rgba(252,245,247,.93) 0%,
    rgba(252,245,247,.82) 52%,
    rgba(252,245,247,.34) 78%,
    rgba(252,245,247,0)   100%);
}

.lockup{
  position:relative;
  z-index:3;
  text-align:center;
  padding:0 24px;
  text-shadow:0 0 34px rgba(252,245,247,.98), 0 0 14px rgba(252,245,247,.95), 0 0 5px rgba(252,245,247,.9);
  opacity:0;
  animation:settle 1.6s .45s ease-out forwards;
}

.lab{
  margin:0;
  font-size:clamp(3rem, 12vw, 6.2rem);
  font-weight:200;
  line-height:.92;
  letter-spacing:.09em;
  text-indent:.09em;
  color:var(--pink);
}

.tag{
  margin:.85rem 0 0;
  font-size:clamp(.66rem, 1.7vw, .8rem);
  font-weight:300;
  letter-spacing:.34em;
  text-indent:.34em;
  color:var(--deep);
}

.cross{
  display:block;
  margin:clamp(1rem, 3vw, 1.7rem) 0;
  font-size:clamp(1.9rem, 5.5vw, 3.1rem);
  line-height:1;
  font-weight:200;
  color:var(--pink);
}

.mrk{
  display:block;
  margin:0 auto;
  width:clamp(160px, 23vw, 290px);
  height:auto;
  filter:
    drop-shadow(0 0 18px rgba(252,245,247,.97))
    drop-shadow(0 0 7px rgba(252,245,247,.95));
}

.soon{
  margin:clamp(1.9rem, 6vw, 3rem) 0 0;
  font-size:clamp(.82rem, 2.2vw, 1rem);
  font-weight:400;
  text-transform:uppercase;
  letter-spacing:.24em;
  text-indent:.24em;
  color:var(--deep);
}


/* ---------- smaller screens ---------- */

@media (max-width:820px){
  .scrim{background:radial-gradient(
    58% 40% at 50% 50%,
    rgba(252,245,247,.96) 0%,
    rgba(252,245,247,.9)  52%,
    rgba(252,245,247,0)   100%)}
}

@media (max-width:480px){
  .stage{perspective:900px}
}

/* ---------- stillness on request ---------- */

@media (prefers-reduced-motion:reduce){
  .vortex, .face{animation-play-state:paused}
  .stage, .lockup{animation-duration:.01ms; opacity:1}
  .tilt{transition:none}
}
</style>
</head>

<body>
<main class="page">

  <div class="stage" aria-hidden="true">
    <div class="tilt" id="tilt">
      <div class="vortex" id="vortex"></div>
    </div>
  </div>

  <div class="scrim" aria-hidden="true"></div>

  <div class="lockup">
    <h1 class="lab">LAB82</h1>
    <p class="tag">where science meets skin</p>
    <span class="cross">&#215;</span>
    <img class="mrk" src="btrmrk.png" alt="BTRMRK" width="1100" height="143">
    <p class="soon">Coming soon</p>
  </div>

</main>

<script>
(function () {
  /* Photos used in the vortex. Add more files here as you add them
     to the folder — the spiral rebuilds itself around the list. */
  var IMAGES = ['Image1.jpg', 'Image2.jpg'];

  var COUNT   = 30;    // cards in the spiral
  var TURNS   = 2.6;   // how many times it wraps around
  var SECONDS = 46;    // must match --spin in the CSS

  var vortex = document.getElementById('vortex');
  if (!vortex) return;

  var frag = document.createDocumentFragment();

  for (var i = 0; i < COUNT; i++) {
    var t = i / (COUNT - 1);          // 0 at the base, 1 at the top
    var u = t * 2 - 1;                // -1 .. 1
    var angle = (i * 360 * TURNS / COUNT) % 360;

    var card = document.createElement('div');
    card.className = 'card';
    card.style.setProperty('--a', angle.toFixed(2));
    card.style.setProperty('--y', u.toFixed(3));
    // barrel: widest through the middle, drawing in top and bottom
    card.style.setProperty('--r', (0.55 + 0.45 * Math.cos(u * Math.PI / 2)).toFixed(3));
    card.style.setProperty('--s', (0.78 + 0.22 * Math.cos(u * Math.PI / 2)).toFixed(3));

    var face = document.createElement('div');
    face.className = 'face';
    // phase-lock the fade to this card's place on the turn
    face.style.animationDelay = ((angle / 360 - 1) * SECONDS).toFixed(2) + 's';

    var img = document.createElement('img');
    img.src = IMAGES[i % IMAGES.length];
    img.alt = '';
    img.loading = i < 12 ? 'eager' : 'lazy';
    img.decoding = 'async';
    // shift the crop and flip alternates so repeats don't read as repeats
    img.style.objectPosition = (18 + (i * 29) % 64) + '% ' + (20 + (i * 41) % 60) + '%';
    if (i % 3 === 1) img.style.transform = 'scaleX(-1)';
    // if a file is missing, the card stays a soft blush panel
    img.addEventListener('error', function () { this.remove(); });

    face.appendChild(img);
    card.appendChild(face);
    frag.appendChild(card);
  }

  vortex.appendChild(frag);

  /* Lean the vortex toward the pointer. */
  var still = window.matchMedia('(prefers-reduced-motion: reduce)');
  var fine  = window.matchMedia('(pointer: fine)');
  if (still.matches || !fine.matches) return;

  var tilt = document.getElementById('tilt');
  window.addEventListener('pointermove', function (e) {
    var x = (e.clientX / window.innerWidth  - 0.5) * 2;
    var y = (e.clientY / window.innerHeight - 0.5) * 2;
    tilt.style.transform =
      'rotateZ(' + (-4 + x * 2.5).toFixed(2) + 'deg) ' +
      'rotateX(' + (5 - y * 5).toFixed(2) + 'deg) ' +
      'rotateY(' + (x * 5).toFixed(2) + 'deg)';
  }, {passive: true});
})();
</script>
</body>
</html>
