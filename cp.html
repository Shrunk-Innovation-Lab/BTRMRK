<script>
/* ============================================================
   Real refractive glass: three.js MeshPhysicalMaterial with
   transmission + IOR, lit by a hand-built environment map.
   Falls back to the 2D canvas render if three.js can't load.
   ============================================================ */
var STILL = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function init3D(){
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(30, innerWidth/innerHeight, 0.1, 100);
  camera.position.set(0, 0, 7.4);

  var SMALL = Math.min(innerWidth, innerHeight) < 620 || innerWidth < 760;

  var renderer = new THREE.WebGLRenderer({antialias:!SMALL, powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, SMALL ? 1.5 : 1.75));
  renderer.setClearColor(0x05010a, 1);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  /* ---------- environment: what the glass reflects and bends ---------- */
  function envTexture(){
    var c = document.createElement('canvas');
    c.width = 1024; c.height = 512;
    var g = c.getContext('2d');
    g.fillStyle = '#06020b'; g.fillRect(0,0,1024,512);
    function blob(x,y,r,col,a){
      var rg = g.createRadialGradient(x,y,0,x,y,r);
      rg.addColorStop(0,col); rg.addColorStop(1,'rgba(0,0,0,0)');
      g.globalAlpha = a; g.fillStyle = rg;
      g.fillRect(x-r,y-r,r*2,r*2); g.globalAlpha = 1;
    }
    blob(250, 70,320,'#ffffff',1.0);    // key light overhead
    blob(400, 40, 70,'#ffffff',1.0);    // small hard source = crisp specular
    blob(775,140,270,'#ffc2e2',0.9);    // pink fill
    blob(905,330, 80,'#ffffff',0.85);   // second specular
    blob(520,395,330,'#9a86ff',0.55);   // violet bounce from below
    blob( 55,300,190,'#7fe3d6',0.45);   // mint kicker
    var t = new THREE.CanvasTexture(c);
    t.mapping = THREE.EquirectangularReflectionMapping;
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
  }
  var pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  scene.environment = pmrem.fromEquirectangular(envTexture()).texture;

  /* ---------- backdrop (the glass refracts this) ---------- */
  (function(){
    var c = document.createElement('canvas');
    c.width = c.height = 512;
    var g = c.getContext('2d');
    var rg = g.createRadialGradient(256,230,10,256,230,300);
    rg.addColorStop(0,'#3a1030');
    rg.addColorStop(0.45,'#1a0618');
    rg.addColorStop(1,'#05010a');
    g.fillStyle = rg; g.fillRect(0,0,512,512);
    var tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    var plane = new THREE.Mesh(
      new THREE.PlaneGeometry(38,38),
      new THREE.MeshBasicMaterial({map:tex})
    );
    plane.position.z = -9;
    scene.add(plane);
  })();

  /* ---------- lights on top of the env ---------- */
  var key = new THREE.DirectionalLight(0xffffff, 2.4);
  key.position.set(-3, 5, 4); scene.add(key);
  var rimPink = new THREE.PointLight(0xff3d92, 45, 0, 2);
  rimPink.position.set(3.4, 1.2, -2.2); scene.add(rimPink);
  var rimViolet = new THREE.PointLight(0x9a86ff, 38, 0, 2);
  rimViolet.position.set(-3.6, -1.4, -2.0); scene.add(rimViolet);
  scene.add(new THREE.AmbientLight(0xffffff, 0.25));

  /* ---------- the bar ---------- */
  function roundedShape(w,h,rt,rb){
    var s = new THREE.Shape();
    var x = -w/2, y = -h/2;
    s.moveTo(x, y+rb);
    s.lineTo(x, y+h-rt);
    s.quadraticCurveTo(x, y+h, x+rt, y+h);
    s.lineTo(x+w-rt, y+h);
    s.quadraticCurveTo(x+w, y+h, x+w, y+h-rt);
    s.lineTo(x+w, y+rb);
    s.quadraticCurveTo(x+w, y, x+w-rb, y);
    s.lineTo(x+rb, y);
    s.quadraticCurveTo(x, y, x, y+rb);
    return s;
  }

  var pop = new THREE.Group();
  var rig = new THREE.Group();   // holds the pop so we can centre it
  rig.add(pop);
  scene.add(rig);

  var BW = 2.05, BH = 3.15, BD = 0.62;
  var barGeo = new THREE.ExtrudeGeometry(
    roundedShape(BW, BH, 0.92, 0.5),
    {depth:BD, bevelEnabled:true, bevelThickness:0.17, bevelSize:0.17, bevelSegments:SMALL?5:8, curveSegments:SMALL?24:40}
  );
  barGeo.center();

  var ice = new THREE.MeshPhysicalMaterial({
    color:0xffffff,
    transmission:1,
    thickness:1.15,
    ior:1.44,
    roughness:0.055,
    metalness:0,
    clearcoat:1,
    clearcoatRoughness:0.07,
    attenuationColor:new THREE.Color(0xc4d6ff),
    attenuationDistance:2.6,
    envMapIntensity:1.6,
    transparent:true
  });
  var bar = new THREE.Mesh(barGeo, ice);
  bar.renderOrder = 2;
  pop.add(bar);

  /* ---------- wooden stick ---------- */
  (function(){
    var c = document.createElement('canvas');
    c.width = 128; c.height = 512;
    var g = c.getContext('2d');
    g.fillStyle = '#c9986e';
    g.fillRect(0,0,128,512);
    for(var i=0;i<220;i++){
      g.globalAlpha = 0.05 + Math.random()*0.12;
      g.fillStyle = Math.random()>0.5 ? '#a97a52' : '#e3bc94';
      var x = Math.random()*128;
      g.fillRect(x, 0, 0.6 + Math.random()*2.2, 512);
    }
    g.globalAlpha = 1;
    var tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;

    var geo = new THREE.ExtrudeGeometry(
      roundedShape(0.46, 2.55, 0.22, 0.22),
      {depth:0.1, bevelEnabled:true, bevelThickness:0.035, bevelSize:0.035, bevelSegments:3, curveSegments:16}
    );
    geo.center();
    var stick = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
      map:tex, roughness:0.72, metalness:0
    }));
    stick.position.y = -2.05;
    pop.add(stick);
  })();

  /* ---------- candy suspended in the ice ---------- */
  var PAL = [0xff3d92,0xe0006b,0xffd84d,0x6fe3cf,0xb79cff,0xff9a3d,0xffffff,0x7cc4ff,0x8ce06a];
  function rng(seed){ return function(){ seed=(seed*1664525+1013904223)%4294967296; return seed/4294967296; }; }
  var rand = rng(20260914);

  var geos = [
    new THREE.SphereGeometry(0.5, SMALL?14:20, SMALL?11:16),
    new THREE.TorusGeometry(0.38, 0.17, SMALL?8:12, SMALL?16:24),
    new THREE.CapsuleGeometry(0.26, 0.42, 6, 14),
    new THREE.IcosahedronGeometry(0.5, 1),
    new THREE.CylinderGeometry(0.46, 0.46, 0.24, SMALL?14:20)
  ];

  function flower(mat, s){
    var g = new THREE.Group();
    for(var p=0;p<5;p++){
      var a = p/5*Math.PI*2;
      var petal = new THREE.Mesh(new THREE.SphereGeometry(0.30,14,12), mat);
      petal.position.set(Math.cos(a)*0.32, Math.sin(a)*0.32, 0);
      g.add(petal);
    }
    var core = new THREE.Mesh(new THREE.SphereGeometry(0.20,14,12),
      new THREE.MeshPhysicalMaterial({color:0xfff3c4, roughness:0.3, clearcoat:1}));
    g.add(core);
    g.scale.setScalar(s);
    return g;
  }

  var bits = [];
  var COUNT = SMALL ? 30 : 46;
  for(var i=0;i<COUNT;i++){
    var col = PAL[(rand()*PAL.length)|0];
    var mat = new THREE.MeshPhysicalMaterial({
      color:col, roughness:0.22, metalness:0, clearcoat:1,
      clearcoatRoughness:0.12, envMapIntensity:1.1
    });
    var s = 0.13 + rand()*0.15;
    var obj;
    if(rand() < 0.25){
      obj = flower(mat, s*1.5);
    } else {
      obj = new THREE.Mesh(geos[(rand()*geos.length)|0], mat);
      obj.scale.setScalar(s*1.35);
    }
    obj.position.set(
      (rand()*2-1) * (BW/2 - 0.30),
      (rand()*2-1) * (BH/2 - 0.34),
      (rand()*2-1) * (BD/2 - 0.02)
    );
    obj.rotation.set(rand()*6.283, rand()*6.283, rand()*6.283);
    obj.userData = {baseY:obj.position.y, ph:rand()*6.283, sp:0.25+rand()*0.5};
    bits.push(obj);
    pop.add(obj);
  }

  /* centre the whole object (bar + stick) vertically on the origin */
  var OBJ_TOP = BH/2;
  var OBJ_BOTTOM = -2.05 - 2.55/2;
  var OBJ_H = OBJ_TOP - OBJ_BOTTOM;
  var OBJ_W = BW + 0.35;
  pop.position.y = -(OBJ_TOP + OBJ_BOTTOM)/2;

  /* frame the whole pop, whatever the screen shape */
  function resize(){
    var el = renderer.domElement;
    var w = el.clientWidth  || innerWidth;
    var hgt = el.clientHeight || innerHeight;
    var aspect = w/hgt;
    var portrait = aspect < 0.85;

    camera.fov = 34;
    camera.aspect = aspect;

    // how much of the frame the pop may fill — leave room for logo + caption
    var fitV = portrait ? 0.56 : 0.70;
    var fitH = portrait ? 0.62 : 0.50;

    var half = Math.tan(THREE.MathUtils.degToRad(camera.fov)/2);
    var dV = (OBJ_H/fitV/2)/half;              // distance needed to fit height
    var dH = (OBJ_W/fitH/2)/(half*aspect);     // distance needed to fit width
    camera.position.z = Math.max(dV, dH);

    camera.updateProjectionMatrix();
    renderer.setSize(w, hgt, false);
  }
  addEventListener('resize', resize, {passive:true});
  addEventListener('orientationchange', function(){ setTimeout(resize, 250); }, {passive:true});
  if(window.visualViewport) visualViewport.addEventListener('resize', resize, {passive:true});
  resize();

  var t0 = 0;
  function tick(now){
    if(!t0) t0 = now;
    var t = (now - t0)/1000;
    pop.rotation.y = t * 0.46;
    rig.position.y = Math.sin(t*0.85) * 0.05;
    for(var k=0;k<bits.length;k++){
      var b = bits[k], u = b.userData;
      b.position.y = u.baseY + Math.sin(t*u.sp + u.ph) * 0.022;
      b.rotation.y += 0.0016;
    }
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }

  if(STILL){
    pop.rotation.y = 0.55;
    renderer.render(scene, camera);
  } else {
    requestAnimationFrame(tick);
  }
}

/* ---------- loader with 2D fallback ---------- */
(function(){
  var s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js';
  s.onload = function(){
    try { init3D(); }
    catch(err){ console.warn('3D failed, falling back', err); fallback2D(); }
  };
  s.onerror = fallback2D;
  document.head.appendChild(s);
})();
function fallback2D(){
  var el = document.getElementById('c');
  if(el) el.hidden = false;

(function(){
var cv = document.getElementById('c');
var ctx = cv.getContext('2d');
var still = window.matchMedia('(prefers-reduced-motion: reduce)');

/* ---------- deterministic candy layout ---------- */
function rng(seed){ return function(){ seed = (seed*1664525 + 1013904223) % 4294967296; return seed/4294967296; }; }
var rand = rng(20260914);

var PALETTE = ['#ff3d92','#e0006b','#ffd84d','#6fe3cf','#b79cff','#ff9a3d','#ffffff','#7cc4ff','#8ce06a'];
var SHAPES  = ['flower','circle','capsule','heart','star','button'];

var candies = [];
for(var i=0;i<42;i++){
  candies.push({
    lx:(rand()*2-1)*0.80,      // across the width of the bar
    ly:(rand()*2-1)*0.88,      // up the bar
    lz:(rand()*2-1)*0.85,      // through its thickness
    r: 0.030 + rand()*0.042,
    col: PALETTE[(rand()*PALETTE.length)|0],
    shape: SHAPES[(rand()*SHAPES.length)|0],
    spin: rand()*Math.PI*2,
    drift: rand()*Math.PI*2
  });
}

/* ---------- geometry ---------- */
var W=0,H=0,dpr=1;
function resize(){
  dpr = Math.min(window.devicePixelRatio||1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',resize,{passive:true});

/* rounded popsicle silhouette: wide bottom radius, softer dome on top */
function barPath(cx,cy,hw,hh){
  var rTop = Math.min(hw*0.98, hh*0.42);
  var rBot = Math.min(hw*0.72, hh*0.30);
  ctx.beginPath();
  ctx.moveTo(cx-hw, cy-hh+rTop);
  ctx.quadraticCurveTo(cx-hw, cy-hh, cx-hw+rTop, cy-hh);
  ctx.lineTo(cx+hw-rTop, cy-hh);
  ctx.quadraticCurveTo(cx+hw, cy-hh, cx+hw, cy-hh+rTop);
  ctx.lineTo(cx+hw, cy+hh-rBot);
  ctx.quadraticCurveTo(cx+hw, cy+hh, cx+hw-rBot, cy+hh);
  ctx.lineTo(cx-hw+rBot, cy+hh);
  ctx.quadraticCurveTo(cx-hw, cy+hh, cx-hw, cy+hh-rBot);
  ctx.closePath();
}

/* ---------- candy shapes ---------- */
function drawCandy(x,y,r,shape,col,rot,alpha){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(rot);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = col;
  var k;
  if(shape==='circle' || shape==='button'){
    ctx.beginPath(); ctx.arc(0,0,r,0,6.2832); ctx.fill();
    if(shape==='button'){
      ctx.globalAlpha = alpha*0.55; ctx.fillStyle='rgba(0,0,0,.5)';
      ctx.beginPath(); ctx.arc(-r*0.28,0,r*0.16,0,6.2832); ctx.fill();
      ctx.beginPath(); ctx.arc( r*0.28,0,r*0.16,0,6.2832); ctx.fill();
    }
  } else if(shape==='capsule'){
    var w=r*1.9,h=r*0.78;
    ctx.beginPath();
    ctx.moveTo(-w/2+h/2,-h/2);
    ctx.arcTo(w/2,-h/2,w/2,h/2,h/2);
    ctx.arcTo(w/2,h/2,-w/2,h/2,h/2);
    ctx.arcTo(-w/2,h/2,-w/2,-h/2,h/2);
    ctx.arcTo(-w/2,-h/2,w/2,-h/2,h/2);
    ctx.closePath(); ctx.fill();
  } else if(shape==='flower'){
    for(k=0;k<5;k++){
      var a=k/5*6.2832;
      ctx.beginPath();
      ctx.arc(Math.cos(a)*r*0.62, Math.sin(a)*r*0.62, r*0.52, 0, 6.2832);
      ctx.fill();
    }
    ctx.globalAlpha = alpha*0.9;
    ctx.fillStyle = '#fff8d8';
    ctx.beginPath(); ctx.arc(0,0,r*0.34,0,6.2832); ctx.fill();
  } else if(shape==='heart'){
    ctx.beginPath();
    ctx.moveTo(0,r*0.9);
    ctx.bezierCurveTo(-r*1.5,-r*0.2,-r*0.6,-r*1.1,0,-r*0.35);
    ctx.bezierCurveTo(r*0.6,-r*1.1,r*1.5,-r*0.2,0,r*0.9);
    ctx.closePath(); ctx.fill();
  } else { /* star */
    ctx.beginPath();
    for(k=0;k<10;k++){
      var ang = -Math.PI/2 + k*Math.PI/5;
      var rad = (k%2===0) ? r : r*0.46;
      var px = Math.cos(ang)*rad, py = Math.sin(ang)*rad;
      if(k) ctx.lineTo(px,py); else ctx.moveTo(px,py);
    }
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

/* ---------- frame ---------- */
function draw(t){
  ctx.clearRect(0,0,W,H);

  var theta = t * 0.46;                    // one turn ~13.6s
  var cos = Math.cos(theta), sin = Math.sin(theta);
  var bob = Math.sin(t*0.9)*(H*0.006);

  var hh   = Math.min(H*0.28, W*0.62);     // half height of the bar
  var halfW = hh*0.62;                     // half width  (face on)
  var halfT = hh*0.22;                     // half thickness (edge on)
  var cx = W/2;
  var cy = H*0.42 + bob;

  var hw = Math.abs(cos)*halfW + Math.abs(sin)*halfT;   // silhouette half-width
  var stickHalf = (Math.abs(cos)*halfW*0.20 + Math.abs(sin)*halfT*0.55);
  var stickTop = cy - hh*0.55;
  var stickBot = cy + hh + Math.min(H*0.20, hh*0.86);

  /* ground glow */
  var glow = ctx.createRadialGradient(cx,cy,hw*0.2,cx,cy,hw*4.2);
  glow.addColorStop(0,'rgba(150,120,255,.16)');
  glow.addColorStop(.45,'rgba(255,61,146,.07)');
  glow.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0,0,W,H);

  /* stick below the bar */
  function stickPath(top,bottom,halfw){
    var r = Math.min(halfw, (bottom-top)*0.5);
    ctx.beginPath();
    ctx.moveTo(cx-halfw, top);
    ctx.lineTo(cx+halfw, top);
    ctx.lineTo(cx+halfw, bottom-r);
    ctx.quadraticCurveTo(cx+halfw, bottom, cx+halfw-r, bottom);
    ctx.lineTo(cx-halfw+r, bottom);
    ctx.quadraticCurveTo(cx-halfw, bottom, cx-halfw, bottom-r);
    ctx.closePath();
  }
  var wood = ctx.createLinearGradient(cx-stickHalf,0,cx+stickHalf,0);
  wood.addColorStop(0,'#8d5f45'); wood.addColorStop(.42,'#d8a884');
  wood.addColorStop(.72,'#b98263'); wood.addColorStop(1,'#7d5340');
  ctx.fillStyle = wood;
  stickPath(cy+hh*0.55, stickBot, stickHalf);
  ctx.fill();

  /* ---- inside the bar ---- */
  ctx.save();
  barPath(cx,cy,hw,hh);
  ctx.clip();

  var body = ctx.createLinearGradient(cx-hw,0,cx+hw,0);
  body.addColorStop(0,'rgba(196,214,255,.30)');
  body.addColorStop(.34,'rgba(38,26,74,.42)');
  body.addColorStop(.72,'rgba(64,44,104,.34)');
  body.addColorStop(1,'rgba(210,224,255,.26)');
  ctx.fillStyle = body;
  ctx.fillRect(cx-hw-2, cy-hh-2, hw*2+4, hh*2+4);

  /* depth-sorted candy */
  var drawn = candies.map(function(c,i){
    var jitterY = Math.sin(t*0.7 + c.drift)*0.012;
    var x = cx + (c.lx*cos + c.lz*sin) * halfW;
    var d =        (-c.lx*sin + c.lz*cos);          // -1 back … +1 front
    var y = cy + (c.ly + jitterY) * hh * 0.86;
    return {x:x, y:y, d:d, c:c, i:i};
  }).sort(function(a,b){ return a.d - b.d; });

  function paint(list){
    list.forEach(function(o){
      var c = o.c;
      var lit = o.d*0.5 + 0.5;                      // 0 back … 1 front
      var scale = 0.72 + 0.28*lit;
      var alpha = 0.34 + 0.66*lit*lit;
      drawCandy(o.x, o.y, c.r*hh*scale, c.shape, c.col,
                c.spin + theta*0.35, alpha);
    });
  }

  paint(drawn.filter(function(o){ return o.d < 0; }));

  /* the stick continues up inside the bar, seen through the ice */
  ctx.globalAlpha = 0.62;
  ctx.fillStyle = wood;
  stickPath(stickTop, cy+hh, stickHalf);
  ctx.fill();
  ctx.globalAlpha = 1;

  paint(drawn.filter(function(o){ return o.d >= 0; }));

  /* frosted sheen over the whole face */
  var sheen = ctx.createLinearGradient(cx-hw,cy-hh,cx+hw,cy+hh);
  sheen.addColorStop(0,'rgba(255,255,255,.16)');
  sheen.addColorStop(.5,'rgba(255,255,255,0)');
  sheen.addColorStop(1,'rgba(255,255,255,.07)');
  ctx.fillStyle = sheen;
  ctx.fillRect(cx-hw-2, cy-hh-2, hw*2+4, hh*2+4);

  /* long specular streak, parked on the left shoulder */
  var streakX = cx - hw*0.46;
  var spec = ctx.createRadialGradient(streakX, cy-hh*0.18, 0, streakX, cy-hh*0.18, hw*0.7);
  spec.addColorStop(0,'rgba(255,255,255,.42)');
  spec.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle = spec;
  ctx.save();
  ctx.translate(streakX, cy-hh*0.18);
  ctx.scale(0.42, 1.5);
  ctx.translate(-streakX, -(cy-hh*0.18));
  ctx.beginPath(); ctx.arc(streakX, cy-hh*0.18, hw*0.7, 0, 6.2832); ctx.fill();
  ctx.restore();

  ctx.restore(); /* end clip */

  /* rim light */
  var rim = ctx.createLinearGradient(cx-hw,0,cx+hw,0);
  rim.addColorStop(0,'rgba(255,255,255,.95)');
  rim.addColorStop(.28,'rgba(168,196,255,.35)');
  rim.addColorStop(.72,'rgba(198,178,255,.45)');
  rim.addColorStop(1,'rgba(255,255,255,.9)');
  ctx.save();
  ctx.shadowColor = 'rgba(178,204,255,.85)';
  ctx.shadowBlur = Math.max(10, hw*0.30);
  ctx.strokeStyle = rim;
  ctx.lineWidth = Math.max(1.4, hh*0.011);
  barPath(cx,cy,hw,hh);
  ctx.stroke();
  ctx.restore();

  /* top gloss cap */
  ctx.save();
  barPath(cx,cy,hw,hh);
  ctx.clip();
  ctx.globalAlpha = .5;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.ellipse(cx + hw*0.12, cy - hh*0.86, hw*0.30, hh*0.045, 0, 0, 6.2832);
  ctx.fill();
  ctx.restore();
}

var t0 = 0;
function loop(now){
  if(!t0) t0 = now;
  draw((now - t0)/1000);
  requestAnimationFrame(loop);
}

resize();
if(still.matches){ draw(2.2); } else { requestAnimationFrame(loop); }
})();

}
</script>
