<!-- ============================================================
     EDIT THESE AND YOU'RE DONE:
       1. the accent colour --mark, if BTRMRK's brand colour differs
       2. SPEED / EYE at the top of the script, to retune the terrain
     ============================================================ -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">

<style>
  :root{
    --paper:      #d7ded9;
    --ink:        #16292c;
    --ink-soft:   #4d6265;
    --mark:       #e0006b;          /* surveyor's marking pink */
    --grid-fine:  rgba(22,41,44,.05);
    --grid-bold:  rgba(22,41,44,.16);
    --rule:       2px;
  }

  *{ box-sizing:border-box; }

  html,body{ height:100%; }

  body{
    margin:0;
    background-color:var(--paper);
    background-image:
      linear-gradient(var(--grid-fine) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-fine) 1px, transparent 1px);
    background-size: 24px 24px, 24px 24px;
    background-position: -1px -1px;
    color:var(--ink);
    font-family:"Archivo", "Helvetica Neue", Arial, sans-serif;
    font-variation-settings:"wdth" 100,"wght" 400;
    font-size:clamp(15px, 1.1vw + 12px, 18px);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- 3d terrain layers ---------- */
  /* A canvas is a replaced element: inset:0 alone leaves it at its intrinsic
     300x150, so the size has to be stated. Layout size lives here in CSS only —
     the script sets the backing store, never the style. */
  #bg{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    height:100lvh;
    z-index:0;
    display:block;
    pointer-events:none;
  }
  .veil{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    height:100lvh;
    z-index:1;
    pointer-events:none;
    background:radial-gradient(
      ellipse 58% 42% at 50% 46%,
      rgba(215,222,217,.96) 0%,
      rgba(215,222,217,.86) 42%,
      rgba(215,222,217,0)   74%);
  }

  .sheet{
    position:relative;
    z-index:2;
    min-height:100%;
    min-height:100svh;
    display:grid;
    grid-template-rows:auto 1fr auto;
    padding:clamp(20px, 4vw, 56px);
    padding-top:calc(clamp(20px, 4vw, 56px) + env(safe-area-inset-top));
    padding-right:calc(clamp(20px, 4vw, 56px) + env(safe-area-inset-right));
    padding-bottom:calc(clamp(20px, 4vw, 56px) + env(safe-area-inset-bottom));
    padding-left:calc(clamp(20px, 4vw, 56px) + env(safe-area-inset-left));
    gap:clamp(24px, 5vh, 64px);
  }

  /* ---------- top rail ---------- */
  .rail{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
    font-size:.82rem;
    letter-spacing:.01em;
    color:var(--ink-soft);
    border-bottom:1px solid var(--grid-bold);
    padding-bottom:10px;
  }
  /* Real BTRMRK wordmark, inlined so it inherits --ink via currentColor.
     Aspect is 11.46:1, so it is sized by height and the width follows. */
  .logotype{
    display:block;
    height:clamp(13px, 3.2vw, 19px);
    width:auto;
    color:var(--ink);
    flex:0 0 auto;
  }

  /* ---------- centre stack ---------- */
  .stage{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
  }

  .headline{
    margin:0;
    max-width:15ch;
    font-variation-settings:"wdth" 110,"wght" 800;
    font-size:clamp(2.15rem, 10.5vw, 7.6rem);
    line-height:.9;
    letter-spacing:-.03em;
    text-wrap:balance;
    overflow-wrap:break-word;
  }

  /* ruler datum under the headline */
  .datum{
    width:min(100%, 62ch);
    margin:clamp(20px, 3.4vh, 40px) 0 clamp(22px, 3.4vh, 40px);
    height:18px;
    border-top:2px solid var(--ink);
    background-image:linear-gradient(90deg, var(--ink) 2px, transparent 2px);
    background-size:24px 9px;
    background-repeat:repeat-x;
    background-position:0 0;
    opacity:.55;
  }

  .lede{
    margin:0;
    max-width:34ch;
    font-size:clamp(1rem, .5vw + .92rem, 1.22rem);
    color:var(--ink-soft);
    text-wrap:balance;
  }

  .note{
    margin:clamp(14px, 2vh, 22px) 0 0;
    max-width:38ch;
    font-size:.95rem;
    color:var(--ink-soft);
    text-wrap:balance;
  }

  /* ---------- footer ---------- */
  .foot{
    font-size:.78rem;
    color:var(--ink-soft);
    border-top:1px solid var(--grid-bold);
    padding-top:10px;
  }

  /* ---------- phones ---------- */
  @media (max-width: 640px){
    /* Lighter than desktop: the mesh should read across the whole screen, and
       the lines it sits behind are hairlines at 26% ink at their very darkest. */
    .veil{
      background:radial-gradient(
        ellipse 150% 44% at 50% 46%,
        rgba(215,222,217,.74) 0%,
        rgba(215,222,217,.52) 56%,
        rgba(215,222,217,0)   90%);
    }
    .datum{ width:100%; margin:clamp(16px,2.6vh,28px) 0; }
    .lede{ max-width:30ch; }
    .note{ max-width:32ch; }
    .headline{ max-width:12ch; }
  }

  @media (max-width: 360px){
    .rail{ font-size:.76rem; gap:8px; }
  }

  /* ---------- landscape phones: very little vertical room ---------- */
  @media (max-height: 520px) and (orientation: landscape){
    .sheet{ gap:14px; }
    .headline{ font-size:clamp(1.7rem, 5.4vw, 3rem); max-width:22ch; }
    .datum{ margin:12px 0; height:12px; }
    .note{ margin-top:8px; }
  }

  /* ---------- one load sequence ---------- */
  .headline{ opacity:0; animation:rise .62s cubic-bezier(.2,.7,.3,1) .12s forwards; }
  .datum{ transform:scaleX(0); transform-origin:left; animation:sweep .72s cubic-bezier(.2,.7,.3,1) .4s forwards; }
  .lede{ opacity:0; animation:rise .5s ease-out .62s forwards; }
  .note{ opacity:0; animation:rise .5s ease-out .76s forwards; }

  @keyframes rise{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:none; } }
  @keyframes sweep{ to{ transform:scaleX(1); } }

  @media (prefers-reduced-motion: reduce){
    .headline,.datum,.lede,.note{
      animation:none;
      opacity:1;
      transform:none;
    }
  }
</style>
</head>
<body>

<canvas id="bg" aria-hidden="true"></canvas>
<div class="veil" aria-hidden="true"></div>

<div class="sheet">

    <span>Under construction</span>
  </div>

  <main class="stage">

    <h1 class="headline">SOMETHING BTR IS COMING.</h1>

    <div class="datum" aria-hidden="true"></div>

    <p class="lede">We’re building a simpler way to understand the impact behind the products you buy.</p>

    <p class="note">BTRMRK is currently under construction. Check back soon.</p>

  </main>

  <div class="foot">© 2026 BTRMRK</div>

<script>
/* Wireframe survey mesh: a ground plane in real perspective, drifting toward
   the viewer. No libraries — the projection is eight lines of maths. */
(function () {
  var canvas = document.getElementById('bg');
  if (!canvas || !canvas.getContext) return;
  var ctx = canvas.getContext('2d');

  var COLS = 30,     // columns across
      ROWS = 34,     // rows into the distance
      XS   = 1.15,   // column spacing (world units)
      ZS   = 1.0,    // row spacing (recomputed per viewport)
      NEAR = 1.4,    // nearest row
      EYE  = 1.55,   // camera height above the plane (recomputed per viewport)
      SPEED = 0.55;  // world units per second, toward the viewer

  var w = 0, h = 0, cx = 0, cy = 0, f = 0, raf = 0;
  var still = window.matchMedia('(prefers-reduced-motion: reduce)');

  function resize() {
    // Measure the canvas box itself, not window.innerHeight — on mobile the
    // two disagree while the address bar slides in and out.
    var box = canvas.getBoundingClientRect();
    var nw = Math.round(box.width)  || window.innerWidth;
    var nh = Math.round(box.height) || window.innerHeight;
    if (nw === w && nh === h) return false;

    w = nw;
    h = nh;

    // Phones need a FINER mesh, not a coarser one. A narrow viewport with a wide
    // lens puts mid-screen at only z~3, where column spacing is f*XS/z — at
    // XS 1.5 that is 150px apart, i.e. three lines on the whole screen. Tighter
    // spacing and a nearer horizon give the same line count a real mesh.
    var narrow = w < 700;
    ROWS = narrow ? 15   : 34;
    ZS   = narrow ? 0.8  : 1.0;
    XS   = narrow ? 0.55 : 1.15;

    cx = w / 2;

    // Focal length from a fixed ~70 degree horizontal field of view. Deriving it
    // from height instead turns a tall phone into a telephoto lens: four giant
    // lines across the screen rather than a mesh.
    f = w * 0.714;

    // Tall screens get a higher horizon so the ground claims more of the frame.
    var ratio = h / w;
    var horizon = Math.min(0.44, Math.max(0.34, 0.44 - (ratio - 0.6) * 0.07));
    cy = h * horizon;

    // Then lift the camera until the nearest row falls past the bottom edge.
    // Without this the plane stops short and leaves blank paper beneath it.
    EYE = Math.max(1.55, NEAR * (h - cy) / f * 1.04);

    // Widen the plane until it runs past both screen edges at the depth where
    // the lines are still visible — otherwise a wide monitor sees the plane end.
    var zDeep  = NEAR + ROWS * ZS * 0.85;
    var reach  = (w / 2) * zDeep / f;   // world half-width needed at that depth
    COLS = Math.ceil((reach * 3.0) / XS);
    COLS = Math.max(narrow ? 20 : 28, Math.min(COLS, 90));

    var dpr = Math.min(window.devicePixelRatio || 1, narrow ? 1.75 : 2);
    // Only the backing store is set here. Touching canvas.style.width would
    // pin the box to a fixed pixel size and the next measurement would be stale.
    canvas.width  = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    return true;
  }

  // Height field — three slow waves, no two in step.
  function elevation(x, z, t) {
    return Math.sin(x * 0.42 + z * 0.18 + t * 0.33) * 0.30
         + Math.sin(z * 0.31 - t * 0.21)            * 0.22
         + Math.sin(x * 0.19 - z * 0.26 + t * 0.14) * 0.16;
  }

  function draw(t) {
    ctx.clearRect(0, 0, w, h);

    var scroll = t * SPEED;
    var shift  = scroll % ZS;

    // Depth fade for free: lines are faint at the horizon, firm underfoot.
    var fade = ctx.createLinearGradient(0, cy, 0, h);
    fade.addColorStop(0,    'rgba(22,41,44,0)');
    fade.addColorStop(0.28, 'rgba(22,41,44,0.07)');
    fade.addColorStop(1,    'rgba(22,41,44,0.26)');
    ctx.strokeStyle = fade;
    ctx.lineWidth = 1;

    var i, j, x, z, y, sx, sy, open;

    // Rows running across
    for (j = 0; j < ROWS; j++) {
      z = NEAR + j * ZS - shift;
      if (z < 0.4) continue;
      ctx.beginPath();
      for (i = 0; i <= COLS; i++) {
        x  = (i - COLS / 2) * XS;
        y  = elevation(x, z + scroll, t);
        sx = cx + f * x / z;
        sy = cy + f * (EYE - y) / z;
        if (i) ctx.lineTo(sx, sy); else ctx.moveTo(sx, sy);
      }
      ctx.stroke();
    }

    // Columns running away
    for (i = 0; i <= COLS; i++) {
      x = (i - COLS / 2) * XS;
      ctx.beginPath();
      open = false;
      for (j = 0; j < ROWS; j++) {
        z = NEAR + j * ZS - shift;
        if (z < 0.4) { open = false; continue; }
        y  = elevation(x, z + scroll, t);
        sx = cx + f * x / z;
        sy = cy + f * (EYE - y) / z;
        if (open) ctx.lineTo(sx, sy); else { ctx.moveTo(sx, sy); open = true; }
      }
      ctx.stroke();
    }
  }

  var elapsed = 0, last = 0;

  function frame(now) {
    if (!last) last = now;
    // Clamp the step so returning to a backgrounded tab doesn't jump the terrain.
    elapsed += Math.min((now - last) / 1000, 0.05);
    last = now;
    draw(elapsed);
    raf = window.requestAnimationFrame(frame);
  }

  function play() {
    if (raf || still.matches) return;
    last = 0;
    raf = window.requestAnimationFrame(frame);
  }
  function pause() {
    if (!raf) return;
    window.cancelAnimationFrame(raf);
    raf = 0;
  }

  function start() {
    resize();
    if (still.matches) { pause(); draw(elapsed); }
    else play();
  }

  // Phones fire resize constantly as the address bar slides; coalesce them.
  var pending = 0;
  function onResize() {
    window.clearTimeout(pending);
    pending = window.setTimeout(function () {
      var changed = resize();
      if (changed && !raf) draw(elapsed);
    }, 140);
  }

  window.addEventListener('resize', onResize, { passive: true });
  window.addEventListener('orientationchange', onResize, { passive: true });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', onResize, { passive: true });
  }

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) pause(); else play();
  });

  if (still.addEventListener) still.addEventListener('change', start);
  else if (still.addListener) still.addListener(start);

  start();
})();
</script>
